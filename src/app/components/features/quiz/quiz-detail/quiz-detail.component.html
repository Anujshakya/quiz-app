<div class="mx-auto max-w-3xl p-4">
  @if (loading()) {
    <div class="rounded-xl border border-gray-200 bg-white p-8 text-center text-gray-600 shadow-sm">
      Loading quiz...
    </div>
  } @else if (loadError(); as error) {
    <div class="rounded-xl border border-red-200 bg-red-50 p-6 text-red-800 shadow-sm" role="alert">
      <p class="font-medium">{{ error }}</p>
      <a routerLink="/quiz" class="mt-3 inline-block text-sm font-medium text-blue-700 hover:underline">
        Back to quizzes
      </a>
    </div>
  } @else if (quiz(); as quiz) {
    @if (!started()) {
      <app-quiz-intro [quiz]="quiz" (start)="startQuiz()" />
    } @else if (!submitted()) {
      @if (currentQuestion(); as question) {
        <app-quiz-question
          [question]="question"
          [currentIndex]="currentIndex()"
          [totalQuestions]="questions().length"
          [answeredCount]="answeredCount()"
          [selectedAnswerId]="selectedAnswerIds()[question.id]"
          (selectAnswer)="onSelectAnswer($event)"
          (previous)="previousQuestion()"
          (next)="nextQuestion()"
          (submit)="submitQuiz()"
        />
      }
    } @else {
      <app-quiz-results
        [questions]="questions()"
        [selectedAnswerIds]="selectedAnswerIds()"
        [score]="score()"
        (restart)="startQuiz()"
      />
    }
  }
</div>
