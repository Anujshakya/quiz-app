<article class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm md:p-8">
  <div class="mb-4 flex flex-wrap items-center gap-2">
    <span class="rounded-full bg-blue-100 px-3 py-1 text-xs font-medium text-blue-800">
      {{ quiz().categoryName }}
    </span>
    <span class="rounded-full px-3 py-1 text-xs font-medium" [class]="getDifficultyClass(quiz().difficulty)">
      {{ quiz().difficulty }}
    </span>
    <span class="rounded-full bg-gray-100 px-3 py-1 text-xs font-medium text-gray-700">
      {{ quiz().topic }}
    </span>
  </div>

  <h1 class="mb-3 text-3xl font-semibold text-gray-900">{{ quiz().title }}</h1>
  <p class="mb-6 max-w-3xl text-base leading-7 text-gray-600">{{ quiz().description }}</p>

  <div class="mb-6 flex flex-wrap gap-4 text-sm text-gray-500">
    <span>{{ quiz().questionCount }} questions</span>
    <span>{{ quiz().plays }} plays</span>
  </div>

  @if (quiz().tags?.length) {
    <div class="mb-8 flex flex-wrap gap-2">
      @for (tag of quiz().tags; track tag) {
        <span class="rounded-md bg-gray-100 px-2 py-1 text-xs text-gray-600">#{{ tag }}</span>
      }
    </div>
  }

  <div class="flex flex-wrap items-center gap-3">
    <button
      type="button"
      class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300"
      (click)="start.emit()"
    >
      Start quiz
    </button>
    <a routerLink="/quiz" class="text-sm font-medium text-gray-600 hover:text-gray-900">
      Back to quizzes
    </a>
  </div>
</article>
