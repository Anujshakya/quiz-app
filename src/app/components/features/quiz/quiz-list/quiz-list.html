@if (loading()) {
  <div class="rounded-lg border border-gray-200 bg-white p-6 text-sm text-gray-600 shadow-sm">
    Loading quizzes...
  </div>
} @else if (loadError(); as error) {
  <div class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert">
    {{ error }}
  </div>
} @else if (quizzes().length === 0) {
  <div
    class="mb-4 rounded-lg border border-blue-200 bg-blue-50 p-4 text-sm text-blue-800"
    role="alert"
  >
    No quizzes found!
  </div>
} @else {
  <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
    @for (quiz of quizzes(); track quiz.id) {
      <app-quiz-card [quiz]="quiz">
      </app-quiz-card>
    }
  </div>
}
