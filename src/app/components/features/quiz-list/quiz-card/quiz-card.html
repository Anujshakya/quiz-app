<article
  class="flex h-full flex-col rounded-xl border border-gray-200 bg-white p-6 shadow-sm transition-shadow hover:shadow-md"
>
  <div class="mb-4 flex items-center justify-between">
    <span class="rounded-full bg-blue-100 px-3 py-1 text-xs font-medium text-blue-800">
      {{ quiz.categoryName }}
    </span>

    <span class="rounded-full px-3 py-1 text-xs font-medium"
          [class]="getDifficultyClass(quiz.difficulty)">
      {{ quiz.difficulty }}
    </span>
  </div>

  <h2 class="mb-2 text-xl font-semibold text-gray-900">
    {{ quiz.title }}
  </h2>

  <p class="mb-5 line-clamp-3 text-sm leading-6 text-gray-600">
    {{ quiz.description }}
  </p>

  <div class="mb-5 flex items-center gap-4 text-sm text-gray-500">
    <span>
      {{ quiz.questionCount }} questions
    </span>

    <span>
      {{ quiz.plays }} plays
    </span>
  </div>

  @if (quiz.tags?.length) {
    <div class="mb-6 flex flex-wrap gap-2">
      @for (tag of quiz.tags; track tag) {
        <span class="rounded-md bg-gray-100 px-2 py-1 text-xs text-gray-600">
          #{{ tag }}
        </span>
      }
    </div>
  }

  <div class="mt-auto">
    <button type="button"
            class="w-full rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300"
            (click)="startQuiz(quiz)"
    >
      Start
    </button>
  </div>
</article>
